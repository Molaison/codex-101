name: Installation tests
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unix native integration and installer contract tests
        if: runner.os != 'Windows'
        run: python -m unittest -q test_lab_install test_onboarding test_profiles test_install_lifecycle test_magpie_onboarding test_magpie_support test_magpie_bootstrap
      - name: Windows lab configuration and launcher contract tests
        if: runner.os == 'Windows'
        run: python -X utf8 -m unittest -q test_lab_install test_install_lifecycle test_magpie_onboarding test_magpie_support test_magpie_bootstrap
      - name: Release payload digest and stable channel contract
        run: python 01_build_release_manifest.py --check
      - name: Bash installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Isolated PowerShell bootstrap and manifest integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test_windows_bootstrap.ps1

  official-client:
    name: Verified official Codex stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download SHA512-verified npm latest and execute native Codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex101-official-smoke
        run: |
          python -c "from codex_provider import official_client, client_version, builtin_catalog; binary=official_client(); models=builtin_catalog(binary); visible=[m.get('slug') for m in models if m.get('visibility') == 'list']; assert visible, 'Official Codex built-in model catalog is empty; refusing to ship a menu that hides native models'; print('Verified native Codex:', client_version(binary), '| built-in models:', len(models), '| visible:', ', '.join(visible))"
